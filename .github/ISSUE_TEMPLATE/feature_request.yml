name: Feature request
description: Suggest an idea or improvement for PetitePass
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. PetitePass aims to stay small, local, and
        secure — it optimizes for maximum security per line of code, dependency,
        and feature. Proposals are weighed against the explicit
        [non-goals](https://github.com/leo-aa88/PetitePass/blob/main/docs/DESIGN.md#2-non-goals)
        and the [feature-admission checklist](https://github.com/leo-aa88/PetitePass/blob/main/docs/DESIGN.md#4-feature-admission-criteria),
        and must not regress the security
        [invariants](https://github.com/leo-aa88/PetitePass/blob/main/docs/DESIGN.md#16-invariants-do-not-regress).
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that PetitePass makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like PetitePass to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Would this touch the master password, the vault file, the clipboard, or where secrets live? How would it stay safe?
    validations:
      required: false
